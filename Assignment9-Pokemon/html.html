<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Recent Journal Articles</title>
        <link rel="stylesheet" href="css.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script src="js.js"></script>
    </head>

    <body>
        
        <div class="container">
            <div class="search">
                <p>
                    Name or ID
                </p> 
                <input type="text" id="pokemonName" placeholder="Enter pokemon name or ID">
                <button onclick="searchPokemon()" id="searchButton" type="button">Search</button>
            </div>



            <div class="display">
                <img src="no-image.jpg" alt="Pokemon sprite" id="pokemonSprite" >
                
            </div>



            <div class="attributes">
                <audio controls>
                    <source src="" type="audio/mp3" id="pokemonAudio">
                </audio>
                <br>

                <div class="dropdown-container">
                    <div class="dropdown-item">
                        <select name="moves" id="move1">
                            <option value="option1">No moves available</option>
                        </select>
                    </div>
                    

                    <div class="dropdown-item">
                        <select name="moves" id="move2">
                            <option value="option1">No moves available</option>
                        </select>
                    </div>
                    

                    <div class="dropdown-item">
                        <select name="moves" id="move3">
                            <option value="option1">No moves available</option>
                        </select>
                    </div>
                    

                    <div class="dropdown-item">
                        <select name="moves" id="move4">
                            <option value="option1">No moves available</option>
                        </select>
                    </div>
                </div>

            </div>




            <div id="team-list">
                <br><br><br>
                <button onclick="addToTeam()" id="teamButton" type="button">Add to team</button>
            
                <div id="team">
                    
                </div>
            </div>

        </div>

    </body>
</html>
